name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys verilator

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Lint
        run: verilator --lint-only --top-module tt_um_rishigovindan_systolic -Isrc src/project.v src/mac_pe.v src/systolic_array.v src/mac_accelerator.v

      - name: Run parameter regression
        run: python3 scripts/regress.py

      - name: Synthesis comparison
        run: python3 scripts/synth_sweep.py

      - name: Test Summary
        uses: test-summary/action@v2.3
        with:
          paths: "test/sim_build/**/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/tb.fst
            test/sim_build/**/results.xml
            test/sim_build/**/run.log
            reports/
